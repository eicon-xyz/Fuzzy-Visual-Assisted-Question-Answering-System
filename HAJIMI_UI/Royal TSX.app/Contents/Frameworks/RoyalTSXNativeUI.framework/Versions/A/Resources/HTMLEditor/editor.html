<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Editor</title>
    <style>body { overflow: hidden; }</style>
	<script src="ckeditor.js"></script>
	<script type="text/javascript">
		// !!! NOTE TO SELF !!!
		// When upgrading CKEditor, make sure to disable languages we don't support on the last line of ckeditor.js

		function getEditor() {
			return CKEDITOR.instances.editor;
		}

		function getContent() {
			return getEditor().getData();
		}
		
		function parseEscapedText(escapedText) {
			return decodeURIComponent(escapedText);
		}
		
		function setContent(escapedText) {
			var text = parseEscapedText(escapedText);
			var editor = getEditor();

			editor.setData(text);
		}

		function setEnabled(isEnabled) {
			var editor = getEditor();

			editor.setReadOnly(!isEnabled);
		}

		function minimizeToolbar() {
			var editor = getEditor();

			editor.destroy();

			CKEDITOR.replace('editor', {
				toolbar: [
					{ items: [ 'Source', 'Find' ] }
				]
			});
		}
	</script>
</head>
<body>
	<textarea class="ckeditor" id="editor" name="editor"></textarea>
</body>
</html>
