# lint/format 配置**不在这里**：见仓库根 ruff.toml（唯一配置源）。
# 这里曾经有 [tool.black] / [tool.isort] / [tool.flake8] / [tool.mypy] 四段，
# 全是死配置：flake8 不读 pyproject.toml，black/isort/mypy 也没有任何入口会跑。
# 留着只会让 agent 以为"已经有 lint 了"，所以删掉，只留 pytest 标记。

[tool.pytest.ini_options]
markers = [
    "e2e: E2E smoke tests that require a real browser (Chromium).",
    "real_llm: Tests that make real LLM API calls (needs API key in .env).",
]
